{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warranty Claim Form | SMG Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
  <h3 class="text-center text-warning mb-3">Warranty Claim Form</h3>
  <form method="POST" class="border p-3 bg-white rounded shadow-sm">
    {% csrf_token %}
    <div class="row">
      <div class="col-md-6 mb-3"><input type="text" name="component" placeholder="Failure Component" class="form-control" required></div>
      <div class="col-md-6 mb-3"><input type="text" name="material_code" placeholder="Material Code" class="form-control"></div>
    </div>

    <div class="mb-3">
      <label>Reason for Replacement (Dealer’s Observation)</label>
      <textarea name="reason_for_replacement" class="form-control" rows="2"></textarea>
    </div>

    <h5 class="text-primary mt-4">Last 5 Service Details</h5>
    <div class="row">
      {% for i in "12345" %}
      <div class="col-md-6 mb-2">
        <input type="text" name="service{{ i }}" placeholder="Service {{ i }} (Date / KMS / Remarks)" class="form-control">
      </div>
      {% endfor %}
    </div>

    <div class="mb-3">
      <label>Technical Details / Tests</label>
      <textarea name="technical_details" class="form-control" rows="3"></textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3"><input type="text" name="customer_signature" placeholder="Customer Signature / Contact No" class="form-control"></div>
      <div class="col-md-6 mb-3"><input type="text" name="dealer_signature" placeholder="Dealer Signature / Stamp" class="form-control"></div>
    </div>

    <button type="submit" class="btn btn-primary">Save Form</button>
    <a href="{% url 'warranty_home' %}" class="btn btn-secondary">Back</a>
  </form>
</div>
</body>
</html>
