{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My PDI Records</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">

  <h4 class="text-primary mb-3">My PDI Records</h4>
  <a href="{% url 'pdi_inspection_form' %}" class="btn btn-outline-primary btn-sm mb-3">New PDI</a>

  <table class="table table-bordered bg-white">
    <thead class="table-light">
      <tr>
        <th>Date</th>
        <th>Model</th>
        <th>VIN</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.date }}</td>
        <td>{{ r.model_name }}</td>
        <td>{{ r.vin }}</td>
        <td>
          {% if status(r) == 'NG' %}
            <span class="badge bg-danger">NG</span>
          {% else %}
            <span class="badge bg-success">OK</span>
          {% endif %}
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">No records found</td></tr>
      {% endfor %}
    </tbody>
  </table>

</div>
</body>
</html>
