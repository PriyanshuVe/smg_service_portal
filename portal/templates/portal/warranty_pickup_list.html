{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Warranty Pickup Records</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container mt-4">
  <h3 class="text-success mb-3">Warranty Pickup Records</h3>

  <table class="table table-bordered bg-white">
    <thead class="table-light">
      <tr>
        <th>Date</th>
        <th>Contact</th>
        <th>Mobile</th>
        <th>PDF</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.created_at|date:"d-m-Y" }}</td>
        <td>{{ r.contact_person }}</td>
        <td>{{ r.mobile_no }}</td>
        <td>
          <a class="btn btn-primary btn-sm" href="{% url 'warranty_pickup_pdf' r.id %}">PDF</a>
        </td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="text-center text-muted">No records found</td></tr>
      {% endfor %}
    </tbody>
  </table>

</div>
</body>
</html>
