{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Dealer-to-Dealer Purchase | SMG Portal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
  <h3 class="text-center text-primary mb-3">Add Dealer-to-Dealer Purchase</h3>

  <form method="POST" class="border p-3 bg-white rounded shadow-sm">
    {% csrf_token %}
    <h5 class="text-secondary">Primary Dealer Details</h5>
    <div class="row">
      <div class="col-md-6 mb-2"><input type="text" name="primary_dealer_name" placeholder="Primary Dealer Name" class="form-control" required></div>
      <div class="col-md-6 mb-2"><input type="text" name="primary_gst" placeholder="GST Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="text" name="primary_code" placeholder="Code Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="text" name="primary_phone" placeholder="Phone Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="email" name="primary_email" placeholder="Email ID" class="form-control"></div>
      <div class="col-md-12 mb-2"><textarea name="primary_address" placeholder="Address" class="form-control" rows="2"></textarea></div>
    </div>

    <h5 class="text-secondary mt-3">Secondary Dealer Details</h5>
    <div class="row">
      <div class="col-md-6 mb-2"><input type="text" name="secondary_dealer_name" placeholder="Secondary Dealer Name" class="form-control" required></div>
      <div class="col-md-6 mb-2"><input type="text" name="secondary_gst" placeholder="GST Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="text" name="secondary_code" placeholder="Code Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="text" name="secondary_phone" placeholder="Phone Number" class="form-control"></div>
      <div class="col-md-6 mb-2"><input type="email" name="secondary_email" placeholder="Email ID" class="form-control"></div>
      <div class="col-md-12 mb-2"><textarea name="secondary_address" placeholder="Address" class="form-control" rows="2"></textarea></div>
    </div>

    <h5 class="text-secondary mt-3">Product & Purchase Details</h5>
    <div class="row">
      <div class="col-md-4 mb-2"><input type="date" name="date_of_purchase" class="form-control" required></div>
      <div class="col-md-4 mb-2"><input type="text" name="model_name" placeholder="Model Name" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="product_color" placeholder="Product Color" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="battery_number" placeholder="Battery Number" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="chasis_number" placeholder="Chasis Number" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="motor_number" placeholder="Motor Number" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="product_code" placeholder="Product Code" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="number" name="price" placeholder="Price (₹)" class="form-control"></div>
    </div>

    <h5 class="text-secondary mt-3">Purchase Representative</h5>
    <div class="row">
      <div class="col-md-4 mb-2"><input type="text" name="purchase_rep_name" placeholder="Purchase Rep Name" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="text" name="purchase_rep_mobile" placeholder="Mobile Number" class="form-control"></div>
      <div class="col-md-4 mb-2"><input type="email" name="purchase_rep_email" placeholder="Email ID" class="form-control"></div>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Save Purchase</button>
    <a href="{% url 'dealer_purchase_list' %}" class="btn btn-secondary mt-3">Cancel</a>
  </form>
</div>
</body>
</html>
